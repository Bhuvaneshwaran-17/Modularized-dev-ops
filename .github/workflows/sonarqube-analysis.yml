name: "SonarCloud Analysis"

on:
  workflow_call:
    inputs:
      java_version:
        type: string
        default: "21"
      pom_path:
        type: string
        default: "pom.xml"
      workdir:
        description: "Directory to run analysis from (e.g., Auth/apps)"
        type: string
        default: "."            # caller should pass the service folder
      sonar_project_key:
        required: true
        type: string
      run_quality_gate:
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true          # SonarCloud: https://sonarcloud.io ; SonarQube: http(s)://host:9000
      SONAR_ORG_KEY:
        required: false         # Required for SonarCloud; omit for SonarQube
      TEAMS_WEBHOOK_URL:
        required: true

jobs:
  sonar:
    name: Sonar Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Run Tests with Coverage (JaCoCo)
        run: mvn -B test jacoco:report -f "${{ inputs.pom_path }}"

      - name: Sonar Scan (with debug)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY }}
        working-directory: ${{ inputs.workdir }}
        run: |
          set -e
          echo "=== Sonar debug ==="
          echo "Project Key     : ${{ inputs.sonar_project_key }}"
          echo "Host URL        : ${SONAR_HOST_URL}"
          if [ -n "${SONAR_ORG_KEY}" ]; then
            echo "Organization    : ${SONAR_ORG_KEY} (SonarCloud)"
          else
            echo "Organization    : (none) (SonarQube/self-hosted)"
          fi
          echo "Working dir     : $(pwd)"
          echo "POM used        : ${{ inputs.pom_path }}"

          ORG_ARG=""
          if [ -n "${SONAR_ORG_KEY}" ]; then
            ORG_ARG="-Dsonar.organization=${SONAR_ORG_KEY}"
          fi

          # -X for Maven debug; -Dsonar.verbose to print scanner internals
          mvn -B -X \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -f "${{ inputs.pom_path }}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${{ inputs.sonar_project_key }}" \
            -Dsonar.qualitygate.wait=${{ inputs.run_quality_gate }} \
            -Dsonar.verbose=true \
            ${ORG_ARG}

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.sonar_project_key }}
          path: |
            **/target/site/jacoco/**
            **/target/surefire-reports/**
          if-no-files-found: warn

  notify-failure:
    needs: sonar
    if: failure()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "SonarCloud Analysis"
      component_name: "${{ inputs.sonar_project_key }}"
      job_name: "Quality Gate & Scan"
      status: "FAILURE"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
