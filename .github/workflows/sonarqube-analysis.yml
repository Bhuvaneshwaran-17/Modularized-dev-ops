name: "SonarCloud Analysis"

on:
  workflow_call:
    inputs:
      java_version:
        type: string
        default: "21"

      # Path to the POM of the module (relative to repo root)
      pom_path:
        type: string
        default: "pom.xml"

      # NEW: Directory to run the analysis from (module root)
      workdir:
        description: "Directory to run analysis from (e.g., Auth/apps)"
        type: string
        default: "."

      sonar_project_key:
        required: true
        type: string

      run_quality_gate:
        type: boolean
        default: true

    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      SONAR_ORG_KEY:
        required: true
      TEAMS_WEBHOOK_URL:
        required: true

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      # ---------- DEBUG BLOCK ----------
      - name: DEBUG — Print inputs & env
        run: |
          echo "===== SONAR DEBUG ====="
          echo "SONAR_HOST_URL    = ${{ secrets.SONAR_HOST_URL }}"
          echo "SONAR_ORG_KEY     = ${{ secrets.SONAR_ORG_KEY }}"
          echo "SONAR_PROJECT_KEY = ${{ inputs.sonar_project_key }}"
          echo "WORKDIR           = ${{ inputs.workdir }}"
          echo "POM PATH          = ${{ inputs.pom_path }}"
          echo "QUALITY GATE      = ${{ inputs.run_quality_gate }}"
          echo "Repo root         = $(pwd)"
          echo "List workdir:"
          ls -la "${{ inputs.workdir }}" || true
          echo "Show POM (first 60 lines):"
          sed -n '1,60p' "${{ inputs.pom_path }}" || true
          echo "========================"

      - name: Run Tests with Coverage (JaCoCo)
        # IMPORTANT: run tests from module’s working directory
        working-directory: ${{ inputs.workdir }}
        run: mvn -B test jacoco:report -f "${{ inputs.pom_path }}"

      - name: SonarCloud Scan (with verbose output)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY }}
        # IMPORTANT: run sonar from module’s working directory
        working-directory: ${{ inputs.workdir }}
        run: |
          set -e
          echo "Running sonar:sonar from: $(pwd)"
          mvn -B -X sonar:sonar \
            -f "${{ inputs.pom_path }}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.organization="${SONAR_ORG_KEY}" \
            -Dsonar.projectKey="${{ inputs.sonar_project_key }}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=${{ inputs.run_quality_gate }} \
            -Dsonar.verbose=true

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.sonar_project_key }}
          path: |
            **/target/site/jacoco/**
            **/target/surefire-reports/**
          if-no-files-found: warn

  notify-failure:
    needs: sonar
    if: failure()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "SonarCloud Analysis"
      component_name: "${{ inputs.sonar_project_key }}"
      job_name: "Quality Gate & Scan"
      status: "FAILURE"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}