name: "SonarCloud Analysis"

on:
  workflow_call:
    inputs:
      java_version:
        type: string
        default: "21"
      pom_path:
        type: string
        default: "pom.xml"
      workdir:
        description: "Directory to run analysis from (e.g., Auth/apps)"
        type: string
        default: "."
      sonar_project_key:
        required: true
        type: string
      run_quality_gate:
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      SONAR_ORG_KEY:
        required: true
      TEAMS_WEBHOOK_URL:
        required: true

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      # ---------- DEBUG ----------
      - name: DEBUG — Print inputs & env
        run: |
          echo "===== SONAR DEBUG ====="
          echo "SONAR_HOST_URL    = ${{ secrets.SONAR_HOST_URL }}"
          echo "SONAR_ORG_KEY     = ${{ secrets.SONAR_ORG_KEY }}"
          echo "SONAR_PROJECT_KEY = ${{ inputs.sonar_project_key }}"
          echo "WORKDIR           = ${{ inputs.workdir }}"
          echo "POM PATH          = ${{ inputs.pom_path }}"
          echo "QUALITY GATE      = ${{ inputs.run_quality_gate }}"
          echo "Repo root         = $(pwd)"
          echo ""
          echo "===== Listing WORKDIR ====="
          ls -la "${{ inputs.workdir }}" || true
          echo ""
          echo "===== Showing module pom.xml (first 60 lines) ====="
          sed -n '1,60p' "${{ inputs.workdir }}/pom.xml" || true
          echo "===================================================="

      - name: Run Tests with Coverage (JaCoCo)
        working-directory: ${{ inputs.workdir }}
        run: |
          set -euxo pipefail
          pwd
          ls -la
          test -f pom.xml
          mvn -B test jacoco:report -f pom.xml

      - name: SonarCloud Scan (with verbose output)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY }}
        working-directory: ${{ inputs.workdir }}
        run: |
          set -euxo pipefail
          pwd
          ls -la
          test -f pom.xml
          mvn -version
          mvn -B -X org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.projectBaseDir=. \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.organization="${SONAR_ORG_KEY}" \
            -Dsonar.projectKey="${{ inputs.sonar_project_key }}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.verbose=true \
            -Dsonar.qualitygate.wait=${{ inputs.run_quality_gate }}

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.sonar_project_key }}
          path: |
            **/target/site/jacoco/**
            **/target/surefire-reports/**
          if-no-files-found: warn

  notify-failure:
    needs: sonar
    if: failure()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "SonarCloud Analysis"
      component_name: "${{ inputs.sonar_project_key }}"
      job_name: "Quality Gate & Scan"
      status: "FAILURE"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
``