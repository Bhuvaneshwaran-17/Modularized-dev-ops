name: "SonarCloud Analysis"

on:
  workflow_call:
    inputs:
      java_version:
        type: string
        default: "21"
      pom_path:
        type: string
        default: "pom.xml"

      # SonarCloud project key (required)
      sonar_project_key:
        required: true
        type: string

      # Wait for Quality Gate result (optional)
      run_quality_gate:
        type: boolean
        default: true

    secrets:
      # Required SonarCloud token
      SONAR_TOKEN:
        required: true

      # Should be https://sonarcloud.io
      SONAR_HOST_URL:
        required: true

      # Your SonarCloud Organization Key (the one you just found)
      SONAR_ORG_KEY:
        required: true

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Run Tests with Coverage (JaCoCo)
        run: mvn -B test jacoco:report -f ${{ inputs.pom_path }}

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY }}
        run: |
          mvn -B sonar:sonar -f ${{ inputs.pom_path }} \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.organization=$SONAR_ORG_KEY \
            -Dsonar.projectKey=${{ inputs.sonar_project_key }} \
            -Dsonar.qualitygate.wait=${{ inputs.run_quality_gate }}

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-test-coverage-reports
          path: |
            **/target/site/jacoco/**
            **/target/surefire-reports/**
          if-no-files-found: warn