name: "Java - Test"

on:
  workflow_call:
    inputs:
      java_version:
        type: string
        default: "21"
      pom_path:
        type: string
        default: "pom.xml"
      test_command:
        type: string
        default: "mvn -B test"
      reports_artifact_name:
        type: string
        default: "test-reports"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Run Tests
        run: ${{ inputs.test_command }} -f ${{ inputs.pom_path }}

      - name: Debug - find test report folders
        if: always()
        run: |
          echo "Searching for surefire/failsafe directories..."
          find . -type d \( -name "surefire-reports" -o -name "failsafe-reports" \) || true
          echo "Searching for Maven target directories..."
          find . -type d -name "target" | head -n 50 || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.reports_artifact_name }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          # Change to ignore if you don't want warnings when there are no tests
          if-no-files-found: warn