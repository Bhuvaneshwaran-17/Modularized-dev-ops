name: "Docker - Build (and optional Push)"

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      push:
        type: boolean
        default: false
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      REGISTRY_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    env:
      IMG_SHA: ${{ secrets.REGISTRY_URL != '' && format('{0}/', secrets.REGISTRY_URL) || '' }}${{ inputs.image_name }}:${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          outputs: type=docker,dest=/tmp/image.tar
          tags: ${{ env.IMG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load image into Docker daemon
        run: docker load -i /tmp/image.tar

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL || 'docker.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker Scout Scan
        run: |
          # Install Docker Scout CLI explicitly to ensure it works
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s -- -b /usr/local/bin
          # Run the scan and output to SARIF
          docker scout cve ${{ env.IMG_SHA }} --format sarif --output scout-report.sarif --exit-code

      - name: Upload Scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scout-report.sarif

      - name: Push image
        if: ${{ inputs.push && success() }}
        run: docker push ${{ env.IMG_SHA }}

  notify-success:
    needs: docker
    if: success()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "Docker Build"
      component_name: "${{ inputs.image_name }}"
      job_name: "Containerization"
      status: "SUCCESS"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  notify-failure:
    needs: docker
    if: failure()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "Docker Failure"
      component_name: "${{ inputs.image_name }}"
      job_name: "Containerization"
      status: "FAILURE"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}