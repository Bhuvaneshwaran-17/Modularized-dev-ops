name: "Docker - Build (and optional Push + GitOps)"

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      push:
        type: boolean
        default: false
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      update_manifests:
        type: boolean
        default: false
      manifest_file:
        type: string
        default: ""
      manifest_image_regex:
        type: string
        default: ""

    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      REGISTRY_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: true
      LOCAL_ECR_CA:
        required: false

jobs:
  docker:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
      security-events: write
      pull-requests: write

    env:
      REGISTRY_URL: ${{ secrets.REGISTRY_URL || '' }}
      IMG_SHA: ${{ (secrets.REGISTRY_URL != '' && format('{0}/', secrets.REGISTRY_URL) || '') }}${{ inputs.image_name }}:${{ github.sha }}
      IS_LOCAL_ECR: ${{ secrets.REGISTRY_URL == '172.27.186.119:4510' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trust Local ECR CA (Optional)
        env:
          IS_LOCAL_ECR: ${{ env.IS_LOCAL_ECR }}
          LOCAL_ECR_CA: ${{ secrets.LOCAL_ECR_CA }}
        run: |
          if [ "${IS_LOCAL_ECR}" = "true" ] && [ -n "${LOCAL_ECR_CA}" ]; then
            sudo mkdir -p /etc/docker/certs.d/172.27.186.119:4510
            echo "${LOCAL_ECR_CA}" | base64 -d | sudo tee /etc/docker/certs.d/172.27.186.119:4510/ca.crt >/dev/null
            sudo systemctl restart docker || true
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------
      # Build (no push)
      # ---------------------
      - name: Build image locally (testing mode - no push)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------
      # Build + Push (when enabled)
      # ---------------------
      - name: Login to registry (non-local ECR)
        if: ${{ inputs.push && env.REGISTRY_URL != '' && env.REGISTRY_URL != '172.27.186.119:4510' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------
      # Security Scan (Non-blocking)
      # ---------------------
      - name: Docker Scout Scan (non-blocking)
        id: scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMG_SHA }}
          ignore-base: true
          exit-code: false     # IMPORTANT: pipeline never fails during testing
          sarif-file: scout-report.sarif
          summary: true
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        if: ${{ always() && hashFiles('scout-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scout-report.sarif

      # ---------------------
      # GitOps Update
      # ---------------------
      - name: Update manifest (GitOps)
        if: ${{ inputs.update_manifests && inputs.manifest_file != '' && success() }}
        run: |
          perl -0777 -pe "s|${{ inputs.manifest_image_regex }}.*|image: ${{ env.IMG_SHA }}|g" -i K8s/${{ inputs.manifest_file }}

      - name: Commit & Push GitOps Change
        if: ${{ inputs.update_manifests && inputs.manifest_file != '' && success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add K8s/${{ inputs.manifest_file }}
          git commit -m "GitOps: ${{ inputs.project_name }} -> ${{ github.sha }}" || echo "No changes"
          git push

  notify-success:
    needs: docker
    if: success()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "Docker Build"
      component_name: "${{ inputs.image_name }}"
      job_name: "Containerization"
      status: "SUCCESS"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  notify-failure:
    needs: docker
    if: failure()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "Docker Failure"
      component_name: "${{ inputs.image_name }}"
      job_name: "Containerization"
      status: "FAILURE"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}