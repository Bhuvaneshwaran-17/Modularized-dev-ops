name: "Docker - Build (and optional Push)"

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string

      # Optional: only needed if your Dockerfile copies from ./artifact
      artifact_name:
        required: false
        type: string
        default: ""

      # Image repo name WITHOUT registry host, e.g. "myregistry/transitcard"
      image_name:
        required: true
        type: string

      push:
        type: boolean
        default: false

      dockerfile:
        type: string
        default: "Dockerfile"

      context:
        type: string
        default: "."

      platforms:
        type: string
        default: "linux/amd64"

      tag_latest:
        type: boolean
        default: true

    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      REGISTRY_URL:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact (optional)
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.context }}/artifact

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login (optional)
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          FULL_IMAGE="${{ secrets.REGISTRY_URL }}/${{ inputs.image_name }}"
          SHA_TAG="${FULL_IMAGE}:${GITHUB_SHA}"

          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ inputs.tag_latest }}" == "true" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "latest_tag=${FULL_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and optional push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        run: |
          echo "✅ Project      : ${{ inputs.project_name }}"
          echo "✅ Context      : ${{ inputs.context }}"
          echo "✅ Dockerfile   : ${{ inputs.dockerfile }}"
          echo "✅ Image (full) : ${{ steps.meta.outputs.full_image }}"
          echo "✅ Tag (SHA)    : ${{ steps.meta.outputs.sha_tag }}"
          if [ -n "${{ steps.meta.outputs.latest_tag }}" ]; then
            echo "✅ Tag (latest) : ${{ steps.meta.outputs.latest_tag }}"
          fi