name: "Docker - Build (and optional Push)"

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      image_name:
        required: true
        type: string
      push:
        type: boolean
        default: false
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      REGISTRY_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Critical for SARIF upload

    env:
      REG_PREFIX: ${{ secrets.REGISTRY_URL != '' && format('{0}/', secrets.REGISTRY_URL) || '' }}
      IMG_LATEST: ${{ secrets.REGISTRY_URL != '' && format('{0}/', secrets.REGISTRY_URL) || '' }}${{ inputs.image_name }}:latest
      IMG_SHA:    ${{ secrets.REGISTRY_URL != '' && format('{0}/', secrets.REGISTRY_URL) || '' }}${{ inputs.image_name }}:${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------- BUILD (Local Load) --------------------
      - name: Build image (load into Docker daemon)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file:    ${{ inputs.dockerfile }}
          push:    false
          load:    true  # Exports image to the local Docker engine for Trivy
          tags: |
            ${{ env.IMG_LATEST }}
            ${{ env.IMG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------- SECOPS GATE (Trivy) --------------------
      - name: Run Trivy vulnerability scanner
        id: trivy_scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMG_SHA }}
          format: 'sarif'
          output: 'trivy.sarif'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to Code Scanning
        if: always() # Ensure report is uploaded even if vulnerabilities are found
        uses: github/codeql-action/upload-sarif@v4 # Updated to v4
        with:
          sarif_file: 'trivy.sarif'

      # -------------------- LOGIN & PUSH --------------------
      - name: Login to Container Registry
        if: ${{ inputs.push && success() }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL || 'docker.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: "Push image (tags: latest and sha)"
        if: ${{ inputs.push && success() }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file:    ${{ inputs.dockerfile }}
          push:    true
          tags: |
            ${{ env.IMG_LATEST }}
            ${{ env.IMG_SHA }}
          cache-from: type=gha # Uses cache from the previous build step