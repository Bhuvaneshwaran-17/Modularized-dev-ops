name: "Docker - Build (and optional Push + GitOps)"

on:
  workflow_call:
    inputs:
      project_name:
        description: "Component/service name (for logs & commit message)"
        required: true
        type: string

      image_name:
        description: "Repository name (no registry prefix). e.g., auth, tap, transitcard"
        required: true
        type: string

      push:
        description: "If true, push image to the registry"
        type: boolean
        default: false

      context:
        description: "Docker build context"
        type: string
        default: "."

      dockerfile:
        description: "Path to Dockerfile"
        type: string
        default: "Dockerfile"

      update_manifests:
        description: "If true, update Kubernetes manifest with new image tag and commit"
        type: boolean
        default: false

      manifest_file:
        description: "Path to the k8s manifest to update (e.g., k8s/auth.yaml)"
        type: string
        default: ""

      manifest_image_regex:
        description: >
          Perl-compatible regex (escaped) to match the start of your image line.
          Example:
            ^[[:space:]]*image:[[:space:]]*172\\.27\\.186\\.119:4510\\/auth:
        type: string
        default: ""

    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      REGISTRY_URL:
        required: false
      TEAMS_WEBHOOK_URL:
        required: true
      LOCAL_ECR_CA:
        required: false

jobs:
  docker:
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: write
      security-events: write
      pull-requests: write

    env:
      REGISTRY_URL: ${{ secrets.REGISTRY_URL || '' }}
      IMG_SHA: ${{ (secrets.REGISTRY_URL != '' && format('{0}/', secrets.REGISTRY_URL) || '') }}${{ inputs.image_name }}:${{ github.sha }}
      IS_LOCAL_ECR: ${{ secrets.REGISTRY_URL == '172.27.186.119:4510' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trust local ECR CA if provided
        env:
          IS_LOCAL_ECR: ${{ env.IS_LOCAL_ECR }}
          LOCAL_ECR_CA: ${{ secrets.LOCAL_ECR_CA }}
        run: |
          if [ "${IS_LOCAL_ECR}" = "true" ] && [ -n "${LOCAL_ECR_CA}" ]; then
            sudo mkdir -p /etc/docker/certs.d/172.27.186.119:4510
            echo "${LOCAL_ECR_CA}" | base64 -d | sudo tee /etc/docker/certs.d/172.27.186.119:4510/ca.crt >/dev/null
            sudo systemctl restart docker || true
            echo "[CA] Installed local CA."
          else
            echo "[CA] Skipped."
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image to tar
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          outputs: type=docker,dest=/tmp/image.tar
          tags: ${{ env.IMG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Login (only if NOT local bridge)
        if: ${{ inputs.push && env.REGISTRY_URL != '' && env.REGISTRY_URL != '172.27.186.119:4510' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker Scout Scan
        id: scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMG_SHA }}
          ignore-base: true
          exit-code: false
          sarif-file: scout-report.sarif
          summary: true
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF if exists
        if: ${{ always() && !cancelled() && hashFiles('scout-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scout-report.sarif

      - name: Push image
        if: ${{ inputs.push && success() }}
        run: docker push "${{ env.IMG_SHA }}"

      - name: Update manifest image (GitOps)
        if: ${{ inputs.update_manifests && inputs.manifest_file != '' && inputs.manifest_image_regex != '' && success() }}
        run: |
          echo "Updating image in: ${{ inputs.manifest_file }}"
          perl -0777 -pe "s/${{ inputs.manifest_image_regex }}.*/image: ${{ env.IMG_SHA }}/g" -i ${{ inputs.manifest_file }}
          echo "--- Updated Manifest ---"
          sed -n '1,200p' ${{ inputs.manifest_file }}

      - name: Commit + Push (GitOps)
        if: ${{ inputs.update_manifests && inputs.manifest_file != '' && success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.manifest_file }}
          git commit -m "GitOps: ${{ inputs.project_name }} -> ${{ github.sha }}" || echo "No changes"
          git push

  notify-success:
    needs: docker
    if: success()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "Docker Build"
      component_name: "${{ inputs.image_name }}"
      job_name: "Containerization"
      status: "SUCCESS"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  notify-failure:
    needs: docker
    if: failure()
    uses: Bhuvaneshwaran-17/central-devops-tooling/.github/workflows/teams-notifier.yml@main
    with:
      project_name: "Docker Failure"
      component_name: "${{ inputs.image_name }}"
      job_name: "Containerization"
      status: "FAILURE"
    secrets:
      WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}